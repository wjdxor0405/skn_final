[project]
name = "truefit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "1jelly7", email = "koisi1998@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.110.0",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.6",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
truefit = "truefit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# 리뷰 관계·행동 축 배치(src/workers/relation_axis.py)와 그 테스트에만 필요하다.
# API·엔진 경로는 산출 JSON 만 읽으므로 기본 의존성에 넣지 않는다.
#   uv sync --group review-analysis
[dependency-groups]
review-analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
]
# FastAPI TestClient(tests/test_review_summary_api.py)가 httpx 를 요구한다. 없으면 그 테스트만 skip.
test = [
    "httpx>=0.27",
]
